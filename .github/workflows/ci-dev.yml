name: CI Pipeline - Dev Branch

on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: "Job 1 - Build Docker Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Sauvegarde de l'image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar

  security-scan:
    name: "Job 2 - Security Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Telechargement de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l'image Docker
        run: docker load --input /tmp/image.tar

      - name: Scan des vulnerabilites avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    name: "Job 3 - Push Image to Docker Hub"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Telechargement de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l'image Docker
        run: docker load --input /tmp/image.tar

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:latest