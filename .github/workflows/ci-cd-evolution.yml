name: CI-CD Evolution Pipeline

on:
  push:
    branches:
      - dev
      - prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: "Job 1 - Build avec nginx:alpine3.23-slim"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image slim
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:slim-${{ env.IMAGE_TAG }} -t ${{ env.DOCKER_IMAGE }}:slim .
          docker save ${{ env.DOCKER_IMAGE }}:slim-${{ env.IMAGE_TAG }} ${{ env.DOCKER_IMAGE }}:slim -o /tmp/image-slim.tar

      - name: Sauvegarde de l'image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp/image-slim.tar

  security-scan:
    name: "Job 2 - Scan Securite CRITICAL bloque"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Telechargement de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp

      - name: Chargement de l'image Docker
        run: docker load --input /tmp/image-slim.tar

      - name: Scan Trivy - BLOQUE si CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:slim-${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  push-image:
    name: "Job 3 - Push Image slim vers Docker Hub"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Telechargement de l'image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp

      - name: Chargement de l'image Docker
        run: docker load --input /tmp/image-slim.tar

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image slim
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:slim-${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:slim

  notify:
    name: "Job 4 - Notification Email"
    runs-on: ubuntu-latest
    needs: [build, security-scan, push-image]
    if: always()
    steps:
      - name: Notification succes
        if: ${{ needs.push-image.result == 'success' }}
        run: |
          echo "Pipeline reussi !"
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"

      - name: Notification echec
        if: ${{ needs.push-image.result == 'failure' || needs.security-scan.result == 'failure' }}
        run: |
          echo "Pipeline echoue !"
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"