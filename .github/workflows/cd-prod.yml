name: CD Pipeline - Production Branch

on:
  push:
    branches:
      - prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  CONTAINER_NAME: intranet-newdeal-prod

jobs:
  security-scan:
    name: "Job 1 - Security Scan avant deploiement"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull de l'image depuis Docker Hub
        run: docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Scan Trivy avant deploiement
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  deploy:
    name: "Job 2 - Deploiement en Production port 80"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Arret du conteneur existant
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

      - name: Pull de la derniere image
        run: docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Deploiement du conteneur sur le port 80
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p 80:80 \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Verification que le service tourne
        run: |
          sleep 5
          docker ps | grep ${{ env.CONTAINER_NAME }}
          curl -f http://localhost:80 || exit 1